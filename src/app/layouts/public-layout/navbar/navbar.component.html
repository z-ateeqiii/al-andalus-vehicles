<header
  class="fixed inset-x-0 top-0 z-50 transition-colors duration-200"
  [class]="
    transparent()
      ? 'bg-transparent border-b border-transparent'
      : 'bg-ink border-b border-elevated/40'
  "
>
  <nav class="mx-auto flex h-16 max-w-7xl items-center gap-3 px-4 md:h-20 md:gap-6 md:px-6">
    <!-- Start side: hamburger on mobile, the logo on desktop. -->
    <div class="flex flex-1 items-center md:flex-none">
      <button
        type="button"
        class="flex size-11 items-center justify-center rounded-control text-cream transition hover:text-gold md:hidden"
        (click)="openDrawer.emit()"
        aria-label="افتح القائمة"
      >
        <app-icon name="menu" [size]="24" />
      </button>

      <a routerLink="/" class="hidden md:block" aria-label="الصفحة الرئيسية">
        <app-logo size="md" />
      </a>
    </div>

    <!-- Centre on mobile: the logo. -->
    <a routerLink="/" class="md:hidden" aria-label="الصفحة الرئيسية">
      <app-logo size="sm" />
    </a>

    <ul class="hidden flex-1 items-center justify-center gap-8 md:flex">
      @for (link of links(); track link.label) {
        <li>
          @if (link.fragment) {
            <a
              class="nav-link text-sm font-medium text-cream transition hover:text-gold"
              [routerLink]="link.path"
              [fragment]="link.fragment"
            >
              {{ link.label }}
            </a>
          } @else {
            <a
              class="nav-link text-sm font-medium text-cream transition hover:text-gold"
              [routerLink]="link.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: !!link.exact }"
            >
              {{ link.label }}
            </a>
          }
        </li>
      }
    </ul>

    <!-- End side: search and the quiet admin entrance. -->
    <div class="flex flex-1 items-center justify-end gap-1 md:flex-none">
      @if (searchOpen()) {
        <input
          #searchInput
          type="search"
          class="field-input h-10 w-40 text-sm sm:w-56"
          placeholder="دوّر على عربية…"
          [value]="query()"
          (input)="query.set($any($event.target).value)"
          (keydown)="onSearchKeydown($event)"
          (keydown.enter)="submitSearch()"
          aria-label="دوّر على عربية"
        />
      }

      <button
        type="button"
        class="flex size-11 items-center justify-center rounded-control text-cream transition hover:text-gold"
        (click)="searchOpen() ? submitSearch() : toggleSearch()"
        [attr.aria-label]="searchOpen() ? 'دوّر' : 'افتح البحث'"
        [attr.aria-expanded]="searchOpen()"
      >
        <app-icon name="search" [size]="20" />
      </button>

      <a
        routerLink="/admin/login"
        class="hidden size-11 items-center justify-center rounded-control text-cream transition hover:text-gold md:flex"
        aria-label="دخول الإدارة"
      >
        <app-icon name="user" [size]="20" />
      </a>
    </div>
  </nav>
</header>
