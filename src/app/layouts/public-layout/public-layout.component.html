<a

  class="sr-only focus:not-sr-only focus:absolute focus:top-3 focus:start-3 focus:z-70 focus:rounded-control focus:bg-gold focus:px-4 focus:py-2 focus:text-ink"
>

<app-navbar [links]="links" [overHero]="isHome()" (openDrawer)="drawerOpen.set(true)" />

<main id="main-content" class="min-h-dvh" [class]="isHome() ? '' : 'pt-16 md:pt-20'">

<app-site-footer />
