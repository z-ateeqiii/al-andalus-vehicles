<div class="mx-auto w-full max-w-7xl px-4 py-8 md:px-6 md:py-12">
  <div class="grid gap-8 lg:grid-cols-[minmax(0,1.15fr)_minmax(0,1fr)]">
    <div class="flex flex-col gap-3">
      <div class="aspect-[4/3]">
        <app-skeleton shape="block" width="100%" height="100%" class="h-full" />
      </div>
      <div class="flex gap-2">
        @for (thumb of thumbs; track thumb) {
          <div class="aspect-[4/3] w-20 sm:w-24">
            <app-skeleton shape="block" width="100%" height="100%" class="h-full" />
          </div>
        }
      </div>
    </div>

    <div class="flex flex-col gap-6">
      <div class="flex flex-col gap-2">
        <app-skeleton width="70%" height="2rem" />
        <app-skeleton width="30%" height="1rem" />
      </div>

      <div
        class="grid grid-cols-2 gap-px overflow-hidden rounded-card bg-elevated/40 sm:grid-cols-3"
      >
        @for (cell of cells; track cell) {
          <div class="flex flex-col items-center gap-2 bg-surface px-3 py-5">
            <app-skeleton shape="circle" width="1.25rem" />
            <app-skeleton width="60%" height="0.7rem" />
            <app-skeleton width="80%" height="0.9rem" />
          </div>
        }
      </div>

      <div class="flex flex-col gap-3">
        <app-skeleton shape="block" width="100%" height="2.75rem" />
        <app-skeleton shape="block" width="100%" height="2.75rem" />
      </div>
    </div>
  </div>

  <div class="mt-12">
    <app-skeleton width="10rem" height="1.5rem" class="mb-4" />
    <div class="mt-4 grid grid-cols-2 gap-3 sm:grid-cols-3 lg:grid-cols-6">
      @for (cell of cells; track cell) {
        <app-skeleton shape="block" width="100%" height="6rem" />
      }
    </div>
  </div>
</div>
