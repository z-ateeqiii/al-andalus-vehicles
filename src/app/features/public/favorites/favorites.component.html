<div class="mx-auto w-full max-w-7xl px-4 py-8 md:px-6 md:py-12">
  <header class="mb-6 flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold text-cream md:text-3xl">المفضلة</h1>
      <p class="mt-2 text-sm text-muted">العربيات اللي حفظتها على الجهاز ده.</p>
    </div>

    @if (count()) {
      <button
        type="button"
        class="min-h-11 text-sm text-muted transition hover:text-danger"
        (click)="clear()"
      >
        امسح الكل
      </button>
    }
  </header>

  @if (failed()) {
    <app-error-state (retry)="load()" />
  } @else if (count() === 0) {
    <app-empty-state
      icon="heart"
      title="لسه مفيش عربيات في المفضلة"
      message="دوس على القلب في أي عربية عشان تحفظها هنا وترجعلها بعدين."
      actionLabel="شوف كل العربيات"
      actionLink="/vehicles"
    />
  } @else {
    <app-vehicle-grid [vehicles]="saved()" [skeletonCount]="5" />
  }
</div>
