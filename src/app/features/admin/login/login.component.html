<div class="flex min-h-dvh items-center justify-center bg-ink px-4 py-12">
  <div class="w-full max-w-md">
    <div class="mb-8 flex flex-col items-center gap-3 text-center">
      <app-logo size="lg" [tagline]="true" />
      <p class="text-sm text-muted">لوحة تحكم المعرض</p>
    </div>

    <form
      class="surface-panel flex flex-col gap-5 p-6 md:p-8"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <div class="flex flex-col gap-1.5">
        <label class="text-sm text-cream" for="email">الإيميل</label>
        <input
          id="email"
          type="email"
          class="field-input"
          formControlName="email"
          autocomplete="username"
          inputmode="email"
          dir="ltr"
          placeholder="owner@example.com"
          [attr.aria-invalid]="emailError() ? 'true' : null"
          [attr.aria-describedby]="emailError() ? 'email-error' : null"
        />
        @if (emailError()) {
          <p id="email-error" class="text-xs text-danger">{{ emailError() }}</p>
        }
      </div>

      <div class="flex flex-col gap-1.5">
        <label class="text-sm text-cream" for="password">الباسورد</label>

        <div class="relative">
          <input
            id="password"
            class="field-input pe-12"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            [attr.aria-invalid]="passwordError() ? 'true' : null"
            [attr.aria-describedby]="passwordError() ? 'password-error' : null"
          />

          <button
            type="button"
            class="absolute inset-y-0 end-0 flex w-12 items-center justify-center text-muted transition hover:text-cream"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'اخفي الباسورد' : 'اعرض الباسورد'"
          >
            <app-icon name="eye" [size]="18" />
          </button>
        </div>

        @if (passwordError()) {
          <p id="password-error" class="text-xs text-danger">{{ passwordError() }}</p>
        }
      </div>

      @if (errorMessage()) {
        <p
          class="flex items-start gap-2 rounded-control border border-danger/40 bg-danger/10 px-3 py-2.5 text-sm text-danger"
          role="alert"
        >
          <app-icon name="alert-circle" [size]="18" class="mt-0.5 shrink-0" />
          {{ errorMessage() }}
        </p>
      }

      <button type="submit" class="btn-primary w-full" [disabled]="submitting()">
        @if (submitting()) {
          <span class="spinner" aria-hidden="true"></span>
          بنسجّل دخولك…
        } @else {
          تسجيل الدخول
        }
      </button>
    </form>

    <p class="mt-6 text-center text-xs text-muted">
      الصفحة دي لصاحب المعرض بس. لو وصلت لها بالغلط، ارجع
      <a class="text-gold transition hover:underline" href="/">للصفحة الرئيسية</a>.
    </p>
  </div>
</div>
