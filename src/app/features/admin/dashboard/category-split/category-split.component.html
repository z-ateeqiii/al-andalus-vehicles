<div class="surface-panel flex flex-col gap-4 p-4 md:p-5">
  <h2 class="text-sm font-bold text-cream">توزيع العربيات</h2>

  @if (total() === 0) {
    <p class="text-sm text-muted">لسه مفيش عربيات متسجلة.</p>
  } @else {
    <div
      class="flex h-4 w-full overflow-hidden rounded-full bg-elevated/60"
      role="img"
      [attr.aria-label]="summary()"
    >
      @for (segment of segments(); track segment.key) {
        @if (segment.count > 0) {
          <span class="h-full" [class]="segment.swatch" [style.width.%]="segment.percent"></span>
        }
      }
    </div>

    <ul class="flex flex-wrap items-center gap-x-6 gap-y-2">
      @for (segment of segments(); track segment.key) {
        <li class="flex items-center gap-2 text-sm">
          <span class="size-2.5 shrink-0 rounded-full" [class]="segment.swatch"></span>
          <span class="text-cream">{{ segment.label }}</span>
          <span class="font-latin text-muted">{{ segment.count }} ({{ segment.percent }}%)</span>
        </li>
      }
    </ul>
  }
</div>
