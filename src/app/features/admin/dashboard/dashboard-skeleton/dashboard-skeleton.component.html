<div class="flex flex-col gap-6">
  <app-skeleton shape="block" width="12rem" height="2.75rem" />

  <div class="grid gap-4 sm:grid-cols-2 xl:grid-cols-4">
    @for (card of cards; track card) {
      <div class="surface-panel flex items-center gap-4 p-4 md:p-5">
        <app-skeleton shape="circle" width="3rem" />
        <div class="flex flex-1 flex-col gap-2">
          <app-skeleton width="50%" height="1.75rem" />
          <app-skeleton width="70%" height="0.75rem" />
        </div>
      </div>
    }
  </div>

  <div class="surface-panel flex flex-col gap-4 p-4 md:p-5">
    <app-skeleton width="8rem" height="1rem" />
    <app-skeleton shape="block" width="100%" height="1rem" />
    <app-skeleton width="60%" height="0.9rem" />
  </div>

  <div class="surface-panel flex flex-col gap-4 p-4 md:p-5">
    <app-skeleton width="10rem" height="1rem" />
    @for (row of rows; track row) {
      <div class="flex items-center gap-3">
        <app-skeleton shape="block" width="3.5rem" height="3.5rem" />
        <div class="flex flex-1 flex-col gap-2">
          <app-skeleton width="55%" height="0.9rem" />
          <app-skeleton width="30%" height="0.9rem" />
        </div>
        <app-skeleton shape="block" width="4rem" height="1.5rem" />
      </div>
    }
  </div>
</div>
