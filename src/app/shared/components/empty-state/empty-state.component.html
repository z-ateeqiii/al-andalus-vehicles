<div class="surface-panel flex flex-col items-center gap-3 px-6 py-12 text-center">
  <span class="flex size-14 items-center justify-center rounded-full bg-elevated/50 text-muted">
    <app-icon [name]="icon()" [size]="26" />
  </span>

  <h3 class="text-lg font-bold text-cream">{{ title() }}</h3>

  @if (message()) {
    <p class="max-w-sm text-sm leading-relaxed text-muted">{{ message() }}</p>
  }

  @if (actionLabel()) {
    @if (actionLink()) {
      <a class="btn-secondary mt-2" [routerLink]="actionLink()">{{ actionLabel() }}</a>
    } @else {
      <button type="button" class="btn-secondary mt-2" (click)="action.emit()">
        {{ actionLabel() }}
      </button>
    }
  }
</div>
