<div
  class="pointer-events-none fixed inset-x-0 top-4 z-60 flex flex-col items-center gap-2 px-4 md:inset-x-auto md:top-auto md:bottom-6 md:start-6 md:items-start md:px-0"
  role="status"
  aria-live="polite"
>
  @for (toast of toasts(); track toast.id) {
    <div
      class="toast-item pointer-events-auto flex w-full max-w-sm items-start gap-3 rounded-card border border-elevated/60 bg-surface px-4 py-3 shadow-lg shadow-black/40"
    >
      <app-icon [name]="iconFor(toast)" [size]="20" [class]="accentFor(toast) + ' mt-0.5'" />

      <p class="flex-1 text-sm leading-relaxed text-cream">{{ toast.message }}</p>

      <button
        type="button"
        class="-me-1 rounded p-1 text-muted transition hover:text-cream"
        (click)="dismiss(toast.id)"
        aria-label="اقفل التنبيه"
      >
        <app-icon name="close" [size]="16" />
      </button>
    </div>
  }
</div>
